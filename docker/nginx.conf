user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    # --- INÍCIO DA MUDANÇA PARA DEBUG ---
    # Define um formato de log personalizado chamado 'proxy_debug'
    log_format proxy_debug 'remote_addr: "$remote_addr" | '
                           'x_forwarded_for: "$http_x_forwarded_for" | '
                           'x_forwarded_proto: "$http_x_forwarded_proto" | '
                           'host: "$host" | '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent"';
    # --- FIM DA MUDANÇA PARA DEBUG ---

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # --- MUDANÇA PARA USAR O NOVO LOG ---
        access_log /var/log/nginx/access.log proxy_debug;
        error_log /var/log/nginx/error.log;
        # --- FIM DA MUDANÇA ---

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
}
